<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Review Dashboard — Perspecta Human Insight</title>
<meta name="description" content="Board editorial review dashboard: review, approve, publish, or send back Fellow submissions.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo" aria-label="Perspecta home">
      <span class="logo-badge"><img src="assets/logo.jpg" alt="Perspecta logo"></span>
      <span class="logo-text-wrap">
        <span class="logo-text">Perspecta</span>
        <span class="logo-tagline">Board Review</span>
      </span>
    </a>
    <div class="header-actions">
      <span class="dash-whoami" id="whoami" hidden></span>
      <button class="btn btn-outline" data-action="sign-out">Sign Out</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="dash">
    <div class="container">

      <div class="dash-head">
        <div>
          <span class="eyebrow">Board Workspace</span>
          <h1>Editorial Review</h1>
          <p class="section-sub">Review Fellow submissions, then approve &amp; publish, request changes, or reject with a note.</p>
        </div>
      </div>

      <div class="filter-tabs" role="tablist" aria-label="Filter by status">
        <button class="filter-tab is-active" role="tab" aria-selected="true" data-status="PENDING_REVIEW">Pending Review</button>
        <button class="filter-tab" role="tab" aria-selected="false" data-status="PUBLISHED">Published</button>
        <button class="filter-tab" role="tab" aria-selected="false" data-status="REVISION_REQUESTED">Revision Requested</button>
        <button class="filter-tab" role="tab" aria-selected="false" data-status="REJECTED">Rejected</button>
        <button class="filter-tab" role="tab" aria-selected="false" data-status="ALL">All</button>
      </div>

      <div class="dash-grid">
        <aside class="dash-list" aria-label="Submissions">
          <ul id="queueList" class="dash-article-list">
            <li class="dash-empty" id="queueEmpty">Loading submissions…</li>
          </ul>
        </aside>

        <div class="dash-editor" id="previewPane">
          <p class="dash-empty">Select a submission from the list to review it.</p>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/board-dashboard.js"></script>
</body>
</html>
